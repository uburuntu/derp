name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: derp
          POSTGRES_PASSWORD: derp
          POSTGRES_DB: derp_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U derp -d derp_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://derp:derp@localhost:5433/derp_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: Pyright
        run: uv run --no-sync pyright
      - name: Unit + PostgreSQL tests
        run: uv run --no-sync pytest -q -m "not e2e and not live"
      - name: E2E journeys
        run: uv run --no-sync pytest -q -m e2e
