name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # Allow CD to call this workflow

env:
  PYTHON_VERSION: "3.14.6"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/derp_test"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.30"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: derp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.30"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run and verify database migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests with coverage
        run: uv run pytest --no-logfire -v --cov=derp --cov-report=term-missing
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENVIRONMENT: dev
          TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN_FOR_TESTING"
          GOOGLE_API_PAID_KEY: "test_key"
          LOGFIRE_TOKEN: "test_token"
          LOGFIRE_IGNORE_NO_CONFIG: "1"

  docker:
    name: Docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime image
        run: docker build --tag derp:test .
