[project]
name = "derp"
version = "0.1.0"
description = "AI-powered friendly Telegram bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram[fast,i18n]>=3.30.0,<4",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "babel>=2.18.0",
    "ddgs>=9.14.4",
    "google-genai>=2.12.1,<3",
    "httpx>=0.28.1",
    "logfire[aiohttp,google-genai,httpx,system-metrics]>=4.38.0,<5",
    "opentelemetry-api>=1.43,<1.44",
    "pydantic>=2.13.4,<3",
    "pydantic-ai>=2.13.0,<3",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "uv>=0.11.29",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["references"]

[tool.ruff]
extend-exclude = [
    "migrations",  # Alembic migrations
]

target-version = "py314"

[tool.ruff.lint]
# Extend Ruff's default rules (E4, E7, E9, F) with additional quality rules
extend-select = [
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
]

ignore = ["S311"]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores for common patterns
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["S101", "S105", "A002", "T20"]  # Allow assert, test credentials, shadowing builtins, and print in tests
"scripts/*" = ["T20"]  # Allow print in scripts
