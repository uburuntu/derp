[project]
name = "derp"
version = "0.1.0"
description = "AI-powered friendly Telegram bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram[fast,i18n]>=3.29.1,<4",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "babel>=2.17.0",
    "ddgs>=9.0.0",
    "google-genai>=2.11,<3",
    "httpx>=0.28.1",
    "logfire[aiohttp,httpx,system-metrics]>=4.16,<5",
    "pydantic>=2.12,<3",
    "pydantic-ai>=2.9.1,<3",
    "pydantic-settings>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.40",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "uv",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["references"]

[tool.ruff]
extend-exclude = [
    "migrations",  # Alembic migrations
]

target-version = "py313"

[tool.ruff.lint]
# Extend Ruff's default rules (E4, E7, E9, F) with additional quality rules
extend-select = [
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
]

ignore = ["S311"]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores for common patterns
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["S101", "S105", "A002", "T20"]  # Allow assert, test credentials, shadowing builtins, and print in tests
"scripts/*" = ["T20"]  # Allow print in scripts
