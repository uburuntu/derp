[project]
name = "derp"
version = "2.0.0.dev0"
description = "Derp — a fun, group-first Telegram AI bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28",
    "logfire>=5.2.0",
    "onnxruntime>=1.31",
    "pillow>=12.3",
    "pydantic>=2.12",
    "pydantic-ai-harness[codemode]>=0.57.0",
    "pydantic-ai-slim[openrouter]>=2.57.0",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs the PostgreSQL test database (make db-test-up)",
    "e2e: drives the bot through the fake Bot API",
    "live: spends real money or calls real services; never in CI",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore:Computed default on:UserWarning"]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["references", ".claude", "node_modules"]
per-file-target-version = { "tools/deployment/*.py" = "py310" }  # system Python on the host and CI runners

[tool.ruff.lint]
extend-select = [
    "W",    # pycodestyle warnings
    "B",    # bugbear
    "C4",   # comprehensions
    "I",    # import sorting
    "UP",   # pyupgrade
    "N",    # naming
    "A",    # builtins shadowing
    "S",    # bandit
    "T20",  # print
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = ["S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "A002", "T20", "ASYNC109"]
"migrations/**" = ["N999"]
"tools/**" = ["T20", "S603", "S607", "S108"]

[tool.pyright]
include = ["derp", "tests", "migrations", "tools"]
exclude = ["references", "**/__pycache__", ".venv", ".claude", "node_modules"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["derp/money", "derp/history", "derp/agent"]
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "warning"
executionEnvironments = [{ root = "tools/deployment", pythonVersion = "3.10" }, { root = "." }]

[tool.logfire]
ignore_no_config = true
