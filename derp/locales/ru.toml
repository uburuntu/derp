[pages]
terms = """
📜 **Дерп — условия**

<details><summary>Дерпкоины</summary>

Дерпкоины покупаются за Telegram Stars и оплачивают мои ответы: каждый ответ стоит столько, сколько реально взяли ИИ-модели, плюс наценка. Это не деньги — их нельзя вывести или передать другому. Купленные дерпкоины не сгорают. Derp+ добавляет месячный лимит, который не переносится; отменить подписку можно в любой момент в настройках Stars в Telegram.
</details>

<details><summary>Возвраты</summary>

Проблема с оплатой? Отправьте /paysupport с описанием ситуации. При возврате Stars возвращаются, а оставшиеся дерпкоины из этой покупки списываются.
</details>

<details><summary>Правила использования</summary>

Меня нельзя использовать для незаконных целей или травли людей. Мои ответы генерирует ИИ, и они бывают неверными — в медицинских, юридических и финансовых решениях на них полагаться не стоит. За злоупотребления можно получить блокировку.
</details>

<details><summary>Изменения</summary>

Условия могут меняться; актуальная версия всегда в /terms.
</details>
"""
privacy = """
🔒 **Дерп — приватность**

<details><summary>Что я храню</summary>

Сообщения, в которых меня зовут, и — пока группа это разрешает — остальные сообщения группы для контекста: по умолчанию 30 дней в группах и 365 дней в личке. Короткие сводки дня по чату — до года. Заметки и напоминания, которые меня попросили сохранить, — пока они не сработают или их не удалят. Очки викторин и титулы дня в группах — до /forget. Чеки об оплате — для учёта.
</details>

<details><summary>Кто это обрабатывает</summary>

Чтобы ответить, сообщения уходят ИИ-провайдерам через OpenRouter. Платные ответы и бесплатные дневные идут через провайдеров, которые ничего не хранят. Бесплатные модели (если они включены в настройках) могут сохранять полученное. Когда я ищу в интернете или открываю ссылку, запрос или адрес уходит сервису поиска или загрузки, который может сохранить его в логах. Некоторые инструменты отправляют своему сервису только нужное: погода, курсы валют, Википедия, Urban Dictionary и arXiv получают слова запроса; WolframAlpha — вопрос; JDoodle — код для запуска; ACRCloud — короткий фрагмент звука, чтобы узнать песню; trace.moe — кадр, чтобы найти сцену из аниме. Мемы, вырезание фона и другие эффекты делаются на сервере Дерпа. Отзывы через /feedback читает разработчик Дерпа.
</details>

<details><summary>Что можно сделать</summary>

Команда /forget ответом на сообщение убирает его из моей памяти, а /forget отдельно стирает все сообщения автора в этом чате (дневные сводки пересоберутся уже без них). Забыть заметки или отменить напоминания можно попросить когда угодно; админы групп могут отключить контекст в /settings — сохранённый контекст при этом удаляется.
</details>

<details><summary>Платежи</summary>

Платежами занимается Telegram; я вижу только сумму и номер платежа.
</details>
"""
support_how = "Формат: `/paysupport описание проблемы` — дата и сумма помогут. Сообщение уйдёт напрямую разработчику Дерпа."
