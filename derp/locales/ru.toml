[start]
private = """
**Дерп** — тот самый острый на язык друг в чате. Команды учить не нужно: достаточно написать словами.

<details><summary>💬 Разговор</summary>

Вопросы, советы, прожарки, переводы. Фото, голосовые, видео и ссылки тоже годятся — посмотрю, послушаю, прочитаю.
_«что на фото?» · «о чём эта ссылка?» · «переведи, но драматично»_
</details>

<details><summary>🔎 Поиск и факты</summary>

Свежие новости из интернета, погода, курсы валют, часовые пояса, Википедия, сленг, научные статьи — и песочница Python для точных расчётов.
_«погода в Тбилиси завтра» · «100 долларов в рублях» · «что значит „кринж“?»_
</details>

<details><summary>🎨 Картинки и мемы</summary>

Нарисовать или отредактировать картинку, подписать мем, сделать стикер, пустить гифку или видео задом наперёд, вырезать фон, узнать песню или аниме.
_«нарисуй кота в скафандре» · «сделай мем: опять понедельник» · «что за песня?»_
</details>

<details><summary>👥 Группы</summary>

В группе молчу, пока меня не позовут по имени, через @ или ответом. Пересказываю пропущенное, запускаю опросы и викторины с таблицей лидеров, помню заметки и правила чата.
_«дерп, что я пропустил?» · «дерп, викторина по географии» · «дерп, кто скорее всех опоздает?»_
</details>

<details><summary>⏰ Напоминания</summary>

Разовые и повторяющиеся: напоминания, утренние сводки, вопрос каждую пятницу.
_«напомни в пятницу в 9 позвонить маме» · «каждое утро присылай интересный факт»_
</details>

<details><summary>⭐ Дерпкоины</summary>

За ответы списываются дерпкоины: {daily} бесплатных каждый день, больше — за Telegram Stars через /buy. Команда /info в ответ на моё сообщение покажет его стоимость.
</details>

Работаю и в инлайн-режиме: достаточно набрать @{username} в любом чате.
"""
