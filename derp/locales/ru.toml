[pages]
terms = """
📜 **Дерп — условия**

<details><summary>Дерпкоины</summary>

Дерпкоины покупаются за Telegram Stars и оплачивают мои ответы: каждый ответ стоит столько, сколько реально взяли ИИ-модели, плюс наценка. Это не деньги — их нельзя вывести или передать другому. Купленные дерпкоины не сгорают. Derp+ добавляет месячный лимит, который не переносится; отменить подписку можно в любой момент в настройках Stars в Telegram.
</details>

<details><summary>Возвраты</summary>

Проблема с оплатой? Напиши /paysupport и что случилось. При возврате Stars возвращаются, а оставшиеся дерпкоины из этой покупки списываются.
</details>

<details><summary>Как пользоваться</summary>

Не используй меня для незаконного или чтобы травить людей. Мои ответы генерирует ИИ, и они бывают неверными — не полагайся на них в медицинских, юридических и финансовых решениях. За злоупотребления можно получить блокировку.
</details>

<details><summary>Изменения</summary>

Условия могут меняться; актуальная версия всегда в /terms.
</details>
"""
privacy = """
🔒 **Дерп — приватность**

<details><summary>Что я храню</summary>

Сообщения, в которых меня зовут, и — пока группа это разрешает — остальные сообщения группы для контекста: по умолчанию 30 дней в группах и 365 дней в личке. Короткие сводки дня по чату — до года. Заметки, которые ты просишь запомнить, пока ты их не удалишь. Чеки об оплате — для учёта.
</details>

<details><summary>Кто это обрабатывает</summary>

Чтобы ответить, сообщения уходят ИИ-провайдерам через OpenRouter. Платные ответы и бесплатные дневные идут через провайдеров, которые ничего не хранят. Бесплатные модели — только если их включил ты или, в группе, админ — могут сохранять полученное. Когда я ищу в интернете или открываю ссылку, запрос или адрес уходит поисковому сервису, который может его записать.
</details>

<details><summary>Что ты можешь</summary>

Ответь /forget, чтобы убрать сообщение из моей памяти, или отправь /forget отдельно, чтобы убрать всё, что ты писал в чате (сводки с этим пересоберутся без него). Проси забыть заметки когда угодно; админы групп могут отключить контекст в /settings — сохранённый контекст при этом удаляется.
</details>

<details><summary>Платежи</summary>

Платежами занимается Telegram; я вижу только сумму и номер платежа.
</details>
"""
support_how = "Напиши `/paysupport` и что случилось — дата и сумма помогут. Сообщение уйдёт напрямую тому, кто запускает Дерпа."
