[keys]
intro = """🔌 **Plug in your Claude or ChatGPT**{for_chat}

ChatGPT Pro and Claude Max or Ultra plans include monthly API credits. Plug your API key in and I answer with a smarter model, paid from those credits instead of Derpcoins.

<details><summary>How to get the key</summary>

• **ChatGPT Pro:** claim the credits at chatgpt.com/settings/billing, then create a key at platform.openai.com/api-keys.
• **Claude Max or Ultra:** link a Console organization at claude.ai/settings/billing, then create a key at platform.claude.com/settings/keys.

Best: a key in its own project or workspace with a spend limit there.
</details>

<details><summary>Good to know</summary>

• I never store your key. OpenRouter keeps it encrypted, locked so that only the chats you plug it into can use it. Unplug or remove it any time.
• What I send through your key goes to OpenAI or Anthropic, which may keep it for up to 30 days (not zero data retention).
• Requests run under your provider account, and its usage policy applies to whatever people in the chat ask.
• You set a monthly cap; past it, the chat goes back to my usual model.
</details>

Paste your API key as your next message."""
