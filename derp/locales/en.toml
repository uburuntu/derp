[start]
private = """
**Derp** — the sharp friend in your chats. No commands to learn: just say what you want.

<details><summary>💬 Talk</summary>

Questions, advice, roasts, translations. Send photos, voice messages, videos and links — I look, listen and read.
_“what's in this photo?” · “sum up this link” · “translate this, but dramatic”_
</details>

<details><summary>🔎 Search and lookups</summary>

Fresh news from the web, weather, exchange rates, time zones, Wikipedia, slang, papers — and a Python sandbox for exact math.
_“weather in Tbilisi tomorrow” · “100 USD in euros” · “what does ‘rizz’ mean?”_
</details>

<details><summary>🎨 Pictures and memes</summary>

Draw or edit pictures, caption memes, make stickers, reverse a GIF or video, cut out a background, name that song or anime.
_“draw a cat in a spacesuit” · “meme this: monday again” · “what song is this?”_
</details>

<details><summary>👥 Groups</summary>

Add me to a group: I stay quiet until someone calls me by name, @mentions me or replies to me. I catch people up, run polls and quizzes with a leaderboard, and remember notes and the chat's rules.
_“derp, what did I miss?” · “derp, quiz us on geography” · “derp, who's most likely to be late?”_
</details>

<details><summary>⏰ Reminders</summary>

One-off or repeating: reminders, morning digests, a question every Friday.
_“remind me Friday at 9 to call mom” · “every morning post a fun fact”_
</details>

<details><summary>⭐ Derpcoins</summary>

Answers cost Derpcoins: {daily} free every day, more with Telegram Stars via /buy. Reply /info to any answer to see what it cost.
</details>

Works inline too: type @{username} in any chat.
"""
