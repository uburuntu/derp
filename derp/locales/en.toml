[pages]
terms = """
📜 **Derp — terms**

<details><summary>Derpcoins</summary>

Derpcoins are bought with Telegram Stars and pay for my answers: each answer costs what the AI models actually charged, plus a margin. They aren't money — they can't be cashed out or moved to someone else. Bought Derpcoins don't expire. Derp+ adds a monthly allowance that doesn't roll over; cancel it anytime in Telegram's Stars settings.
</details>

<details><summary>Refunds</summary>

Payment trouble? Write /paysupport and what happened. A refund returns the Stars and removes whatever is left of that purchase's Derpcoins.
</details>

<details><summary>Using Derp</summary>

Don't use me for anything illegal or to harass people. My answers are AI-generated and can be wrong — don't rely on them for medical, legal or financial decisions. Abuse can get you blocked.
</details>

<details><summary>Your own API keys</summary>

You can plug your own OpenAI or Anthropic API key into chats you choose. Answers there run on your provider account and spend its credits, up to the monthly cap you set; that provider's terms and usage policy apply to everything I send through it, including what other people in the chat ask. You can pause, unplug or remove the key anytime in /settings; group admins and you can unplug it from a group. I'm not responsible for what your provider charges or decides about your account.
</details>

<details><summary>Changes</summary>

These terms can change; the current version is always in /terms.
</details>
"""
privacy = """
🔒 **Derp — privacy**

<details><summary>What I keep</summary>

Messages that invoke me, and — while a group allows it — other group messages for context: 30 days in groups and 365 days in private chats by default. Contacts and locations shared in a chat are kept like any other message, for the same time. Short daily summaries of a chat, for up to a year. Notes and reminders you ask me to keep, until they finish or you remove them. Quiz points and titles of the day in groups, until /forget. Payment receipts, for accounting. Diagnostics hold only numbers, except when an answer fails: then a shortened copy of that exchange, with credentials masked, is kept so the developer can debug it. Nothing is used to train AI models, and nothing from one chat is used in another — apart from public stickers, which I may reuse anywhere.
</details>

<details><summary>Who processes it</summary>

When a group admin enables an automatic reply, eligible human messages, their recent context and relevant pictures or transcripts are screened through OpenRouter against the configured condition. The group can inspect and remove its rules in /settings.

To answer, messages go to AI providers through OpenRouter. Paid answers and the free daily ones use providers that keep nothing. Free models — only if you, or an admin for a group, turned them on — may store what they get. In a chat where someone plugged in their own Claude or ChatGPT key (an admin turned it on in a group, with a notice), answers go to Anthropic or OpenAI under that person's account, which keep what they get for up to 30 days (longer if it's flagged); OpenRouter holds the key itself, and I never store it. When a group admin enables a reply rule, the group's eligible human messages, short context and any photo needed for the condition go through OpenRouter for screening. Members can ask about the shared wallet, including who spent it here. When I search the web or open a link, the query or address goes to a search or fetch service that may log it. Some tools send only what they need to their own service: weather, market data (Binance, Moscow Exchange, Yahoo Finance, CoinGecko, GeckoTerminal, Polymarket), Wikipedia, Urban Dictionary and arXiv get the search words; WolframAlpha the question; JDoodle code to run; ACRCloud a short audio clip to name a song; trace.moe a frame to find an anime scene. Memes, cutouts and other effects are made on Derp's own server. Feedback you send is read by Derp's developer.
</details>

<details><summary>Your controls</summary>

Reply /forget to remove a message from my memory, or send /forget alone to remove everything you've said in a chat (summaries that mention it are redone without it). From the same /forget, group admins can wipe everything I know about the chat: its messages, notes and summaries. Ask me to forget notes or cancel reminders anytime; group admins can turn context off in /settings, which deletes the stored context.
</details>

<details><summary>Payments</summary>

Telegram handles payments; I only see the amount and a charge id. Buying Derpcoins for a group posts a thank-you there with your name and the amount, unless you hide your name (the button on that post, or ask me) — then you're “a mysterious patron”, there and in your later group purchases.
</details>
"""
support_how = "Write `/paysupport` followed by what happened — the date and the amount help. It goes straight to Derp's developer."
support_sent = "Sent to Derp's developer. Refunds come back to your Stars balance."

